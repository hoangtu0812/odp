name: Validate platform foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python sources
        run: python -m py_compile ingestion/maximo/maximo_ingest.py airflow/dags/maximo_dbt_pipeline.py
      - name: Validate Docker Compose model
        run: docker compose --env-file .env.example -f infra/docker-compose/docker-compose.local.yml config --quiet
