<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Loop Data Lab</title>
  <desc id="desc">A looping technical monogram for Loop Data Lab.</desc>
  <defs>
    <linearGradient id="loop" x1="14" y1="12" x2="82" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5FFD6"/>
      <stop offset=".48" stop-color="#69F4B0"/>
      <stop offset="1" stop-color="#50C9FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="80" height="80" rx="5" fill="#081916" stroke="#315F4E"/>
  <path d="M25 23v48h47V48H48V25h24" fill="none" stroke="url(#loop)" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
  <path d="M25 23h18" fill="none" stroke="#DFFFEF" stroke-width="5" stroke-linecap="square"/>
  <circle cx="72" cy="25" r="3" fill="#69F4B0"/>
</svg>
