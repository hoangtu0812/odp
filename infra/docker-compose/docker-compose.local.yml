name: bsr-data-platform

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: bsr-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready reports the server healthy even if a named database is absent.
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d dwh -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  postgres-migrations:
    image: postgres:16.4-alpine
    env_file:
      - ../../.env
    environment:
      PGHOST: postgres
      PGPORT: "5432"
    entrypoint: ["bash", "/scripts/run-migrations.sh"]
    volumes:
      - ../../sql/migrations:/migrations:ro
      - ../../docker/postgres/run-migrations.sh:/scripts/run-migrations.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    profiles: ["tools"]
    working_dir: /usr/app
    env_file:
      - ../../.env
    volumes:
      # dbt writes compiled artifacts to target/ and logs/; both are gitignored.
      - ../../dbt/bsr_analytics:/usr/app
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    entrypoint: ["dbt"]

  maximo-ingest:
    profiles: ["ingestion"]
    build:
      context: ../../ingestion/maximo
    image: bsr-maximo-ingest:1.0.0
    env_file:
      - ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: "5432"
      MAXIMO_ALLOW_INSECURE_HTTP: "${MAXIMO_ALLOW_INSECURE_HTTP:-false}"
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    restart: "no"

  superset-init:
    profiles: ["analytics"]
    build:
      context: ../../docker/superset
    image: bsr-superset:6.0.0
    env_file:
      - ../../.env
    environment: &superset_environment
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-local-development-only-change-before-shared-use}"
      SUPERSET_ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD:-change-me-before-running}"
    entrypoint: ["bash", "/app/pythonpath/init_superset.sh"]
    volumes: &superset_volumes
      - ../../docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../../docker/superset/init_superset.sh:/app/pythonpath/init_superset.sh:ro
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    restart: "no"

  superset:
    profiles: ["analytics"]
    image: bsr-superset:6.0.0
    env_file:
      - ../../.env
    environment: *superset_environment
    command: ["/usr/bin/run-server.sh"]
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes: *superset_volumes
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

  portal:
    profiles: ["portal"]
    build:
      context: ../..
      dockerfile: docker/portal/Dockerfile
    image: bsr-data-portal:1.0.0
    ports:
      - "${PORTAL_PORT:-3000}:80"
    depends_on:
      oauth2-proxy:
        condition: service_started
    restart: unless-stopped

  oauth2-proxy:
    profiles: ["portal"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: platform-portal
      OAUTH2_PROXY_CLIENT_SECRET: "${PORTAL_OIDC_CLIENT_SECRET:?Set PORTAL_OIDC_CLIENT_SECRET in .env}"
      OAUTH2_PROXY_COOKIE_SECRET: "${OAUTH2_PROXY_COOKIE_SECRET:?Set OAUTH2_PROXY_COOKIE_SECRET in .env}"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8180/realms/open-source-data-platform
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://localhost:8180/realms/open-source-data-platform/protocol/openid-connect/auth?kc_idp_hint=azure-entra
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/open-source-data-platform/protocol/openid-connect/token
      OAUTH2_PROXY_PROFILE_URL: http://keycloak:8080/realms/open-source-data-platform/protocol/openid-connect/userinfo
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/open-source-data-platform/protocol/openid-connect/certs
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:3000/oauth2/callback
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SKIP_CLAIMS_FROM_PROFILE_URL: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_SCOPE: "openid profile email"
      OAUTH2_PROXY_UPSTREAMS: static://202
    depends_on:
      keycloak:
        condition: service_started
      keycloak-portal-client-config:
        condition: service_completed_successfully
      keycloak-entra-config:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.0.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../docker/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  blackbox-exporter:
    profiles: ["observability"]
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/config/blackbox.yml"]
    volumes:
      - ../../docker/blackbox/blackbox.yml:/config/blackbox.yml:ro
    restart: unless-stopped

  postgres-exporter:
    profiles: ["observability"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dwh?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-before-shared-use}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  alertmanager:
    profiles: ["observability"]
    image: quay.io/prometheus/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ../../docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ../../docker/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.5.1
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../../docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    restart: unless-stopped

  minio:
    profiles: ["lakehouse"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    profiles: ["lakehouse"]
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing local/warehouse;
        mc mb --ignore-existing local/data-platform;
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  iceberg-rest:
    profiles: ["lakehouse"]
    image: apache/iceberg-rest-fixture:1.10.1
    environment:
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  keycloak:
    profiles: ["governance", "portal"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-shared-use}"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ../../keycloak/realm:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

  keycloak-entra-config:
    profiles: ["governance", "portal"]
    image: quay.io/keycloak/keycloak:26.0.7
    entrypoint: ["/bin/sh", "/scripts/configure-entra.sh"]
    environment:
      KEYCLOAK_ADMIN_USER: "${KEYCLOAK_ADMIN_USER:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-change-me-before-shared-use}"
      AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
      AZURE_CLIENT_ID: "${AZURE_CLIENT_ID}"
      AZURE_CLIENT_SECRET: "${AZURE_CLIENT_SECRET}"
    volumes:
      - ../../keycloak/scripts/configure-entra.sh:/scripts/configure-entra.sh:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  keycloak-portal-client-config:
    profiles: ["governance", "portal"]
    image: quay.io/keycloak/keycloak:26.0.7
    entrypoint: ["/bin/sh", "/scripts/configure-portal-client.sh"]
    environment:
      KEYCLOAK_ADMIN_USER: "${KEYCLOAK_ADMIN_USER:-tuph}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}"
      PORTAL_OIDC_CLIENT_SECRET: "${PORTAL_OIDC_CLIENT_SECRET:?Set PORTAL_OIDC_CLIENT_SECRET in .env}"
    volumes:
      - ../../keycloak/scripts/configure-portal-client.sh:/scripts/configure-portal-client.sh:ro
    depends_on:
      keycloak:
        condition: service_started
    restart: "no"

  opa:
    profiles: ["governance"]
    image: openpolicyagent/opa:0.69.0-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports:
      - "${OPA_PORT:-8182}:8181"
    volumes:
      - ../../opa/policies:/policies:ro
    restart: unless-stopped

  ai-service:
    profiles: ["ai"]
    build:
      context: ../../ai-service
    image: open-source-data-platform-ai-service:1.0.0
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: "5432"
      DBT_DATABASE: dwh
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${AI_SERVICE_PORT:-8010}:8010"
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  trino:
    profiles: ["lakehouse"]
    image: trinodb/trino:483
    env_file:
      - ../../.env
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${TRINO_PORT:-8081}:8080"
    volumes:
      - ../../docker/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      postgres:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    restart: unless-stopped

  airflow-init:
    profiles: ["orchestration"]
    build:
      context: ../../docker/airflow
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHg=}"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USERNAME:-tuph}:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW_ADMIN_USERNAME: "${AIRFLOW_ADMIN_USERNAME:-tuph}"
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}"
      AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:-local-lab-only-api-secret-change-before-shared-use-0123456789abcdef0123456789abcdef}"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-local-lab-only-jwt-secret-change-before-shared-use-0123456789abcdef0123456789abcdef}"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: "${POSTGRES_USER}"
      DBT_PASSWORD: "${POSTGRES_PASSWORD}"
      DBT_DATABASE: dwh
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: "5432"
      MAXIMO_ALLOW_INSECURE_HTTP: "${MAXIMO_ALLOW_INSECURE_HTTP:-false}"
      MAXIMO_INGEST_ENABLED: "${MAXIMO_INGEST_ENABLED:-false}"
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["db", "migrate"]
    volumes: &airflow_volumes
      - ../../airflow/dags:/opt/airflow/dags:ro
      - ../../airflow/logs:/opt/airflow/logs
      - ../../dbt/bsr_analytics:/opt/dbt
      - ../../ingestion/maximo/maximo_ingest.py:/opt/ingestion/maximo_ingest.py:ro
      - ../../docker/airflow/platform-entrypoint.sh:/opt/airflow/platform-entrypoint.sh:ro
    depends_on:
      postgres-migrations:
        condition: service_completed_successfully
    restart: "no"

  airflow-api-server:
    profiles: ["orchestration"]
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: *airflow_environment
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["api-server"]
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    profiles: ["orchestration"]
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: *airflow_environment
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["scheduler"]
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    profiles: ["orchestration"]
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: *airflow_environment
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["dag-processor"]
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_data:
  keycloak_data:
