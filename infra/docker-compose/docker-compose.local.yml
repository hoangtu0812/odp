name: bsr-data-platform

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: bsr-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # pg_isready reports the server healthy even if a named database is absent.
      test: ["CMD-SHELL", "psql -U $$POSTGRES_USER -d dwh -c 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    profiles: ["tools"]
    working_dir: /usr/app
    env_file:
      - ../../.env
    volumes:
      # dbt writes compiled artifacts to target/ and logs/; both are gitignored.
      - ../../dbt/bsr_analytics:/usr/app
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["dbt"]

  airflow-init:
    profiles: ["orchestration"]
    build:
      context: ../../docker/airflow
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHg=}"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:-local-lab-only-api-secret-change-before-shared-use-0123456789abcdef0123456789abcdef}"
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-local-lab-only-jwt-secret-change-before-shared-use-0123456789abcdef0123456789abcdef}"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_USER: "${POSTGRES_USER}"
      DBT_PASSWORD: "${POSTGRES_PASSWORD}"
      DBT_DATABASE: dwh
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["db", "migrate"]
    volumes: &airflow_volumes
      - ../../airflow/dags:/opt/airflow/dags:ro
      - ../../airflow/logs:/opt/airflow/logs
      - ../../dbt/bsr_analytics:/opt/dbt
      - ../../docker/airflow/platform-entrypoint.sh:/opt/airflow/platform-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    profiles: ["orchestration"]
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: *airflow_environment
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["api-server"]
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    profiles: ["orchestration"]
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: *airflow_environment
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["scheduler"]
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-dag-processor:
    profiles: ["orchestration"]
    image: bsr-airflow:3.3.0-dbt-1.9.0
    env_file:
      - ../../.env
    environment: *airflow_environment
    entrypoint: ["bash", "/opt/airflow/platform-entrypoint.sh"]
    command: ["dag-processor"]
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
