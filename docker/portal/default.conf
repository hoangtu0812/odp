server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    location = /health/airflow {
        set $upstream http://airflow-api-server:8080;
        proxy_pass $upstream/api/v2/monitor/health;
    }
    location = /health/superset {
        set $upstream http://superset:8088;
        proxy_pass $upstream/health;
    }
    location = /health/minio {
        set $upstream http://minio:9000;
        proxy_pass $upstream/minio/health/live;
    }
    location = /health/trino {
        set $upstream http://trino:8080;
        proxy_pass $upstream/v1/info;
    }
    location = /health/grafana {
        set $upstream http://grafana:3000;
        proxy_pass $upstream/api/health;
    }
    location = /health/prometheus {
        set $upstream http://prometheus:9090;
        proxy_pass $upstream/-/ready;
    }
    location = /health/postgres-exporter {
        set $upstream http://postgres-exporter:9187;
        proxy_pass $upstream/metrics;
    }
    location = /health/keycloak {
        set $upstream http://keycloak:8080;
        proxy_pass $upstream/realms/open-source-data-platform/.well-known/openid-configuration;
    }
    location = /health/opa {
        set $upstream http://opa:8181;
        proxy_pass $upstream/health;
    }
    location = /health/iceberg {
        set $upstream http://iceberg-rest:8181;
        proxy_pass $upstream/v1/config;
    }
    location = /health/ai {
        set $upstream http://ai-service:8010;
        proxy_pass $upstream/health;
    }
    location = /health/airbyte {
        set $upstream http://host.docker.internal:8001;
        proxy_pass $upstream/;
    }
    location = /health/openmetadata {
        set $upstream http://host.docker.internal:8585;
        proxy_pass $upstream/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
