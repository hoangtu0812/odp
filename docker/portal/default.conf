server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Preserve the browser's local port when Nginx emits a relative redirect.
    absolute_redirect off;

    resolver 127.0.0.11 ipv6=off valid=10s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;

    # OAuth2 Proxy owns the browser session; the public landing page starts
    # the Azure Entra -> Keycloak authorization-code flow from this same origin.
    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        # Keycloak session cookies can exceed Nginx's 4 KB default header buffer.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 24k;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /oauth2/auth {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
    location @oauth2_signin {
        return 302 /oauth2/start?rd=$scheme://$http_host$request_uri;
    }

    location = /portal {
        return 302 /portal/;
    }
    location /portal/ {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        try_files $uri $uri/ /portal/index.html;
    }

    location = /health/airflow { set $upstream http://airflow-api-server:8080; proxy_pass $upstream/api/v2/monitor/health; }
    location = /health/superset { set $upstream http://superset:8088; proxy_pass $upstream/health; }
    location = /health/minio { set $upstream http://minio:9000; proxy_pass $upstream/minio/health/live; }
    location = /health/trino { set $upstream http://trino:8080; proxy_pass $upstream/v1/info; }
    location = /health/grafana { set $upstream http://grafana:3000; proxy_pass $upstream/api/health; }
    location = /health/prometheus { set $upstream http://prometheus:9090; proxy_pass $upstream/-/ready; }
    location = /health/postgres-exporter { set $upstream http://postgres-exporter:9187; proxy_pass $upstream/metrics; }
    location = /health/keycloak { set $upstream http://keycloak:8080; proxy_pass $upstream/realms/open-source-data-platform/.well-known/openid-configuration; }
    location = /health/opa { set $upstream http://opa:8181; proxy_pass $upstream/health; }
    location = /health/iceberg { set $upstream http://iceberg-rest:8181; proxy_pass $upstream/v1/config; }
    location = /health/ai { set $upstream http://ai-service:8010; proxy_pass $upstream/health; }
    location = /health/airbyte { set $upstream http://host.docker.internal:8001; proxy_pass $upstream/; }
    location = /health/openmetadata { set $upstream http://host.docker.internal:8585; proxy_pass $upstream/; }

    # The landing page remains public. The full launcher exists only below /portal/.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
