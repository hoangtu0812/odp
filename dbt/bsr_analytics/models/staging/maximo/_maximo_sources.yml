version: 2

sources:
  - name: raw
    description: Dữ liệu gốc được đồng bộ từ Maximo. Seed được dùng cho local lab.
    schema: raw
    tables:
      - name: maximo_workorder
        description: Maximo work orders landed without business transformations.
        columns:
          - name: wo_number
            tests:
              - not_null
              - unique

models:
  - name: stg_maximo_workorder
    description: Work orders đã chuẩn hóa kiểu dữ liệu và mã nghiệp vụ.
    columns:
      - name: wo_number
        tests:
          - not_null
          - unique
      - name: status
        tests:
          - accepted_values:
              values: [WAPPR, APPR, INPRG, COMP, CAN]
