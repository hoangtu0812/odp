version: 2

sources:
  - name: raw
    description: Dữ liệu gốc được custom connector đồng bộ incremental từ Maximo.
    schema: raw
    tables:
      - name: maximo_workorder
        description: Maximo work orders landed without business transformations.
        columns:
          - name: source_key
            tests:
              - not_null
              - unique

models:
  - name: stg_maximo_workorder
    description: Work orders đã chuẩn hóa kiểu dữ liệu và mã nghiệp vụ.
    columns:
      - name: work_order_key
        tests:
          - not_null
          - unique
      - name: status
        tests:
          # Status workflows are configured per Maximo implementation; require
          # a populated code without rejecting valid BSR-specific statuses.
          - not_null
