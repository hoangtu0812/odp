version: 2

models:
  - name: dim_equipment
    columns:
      - name: equipment_key
        tests: [not_null, unique]
      - name: equipment_code
        tests: [not_null]
  - name: dim_department
    columns:
      - name: department_key
        tests: [not_null, unique]
      - name: department_code
        tests: [not_null]
  - name: fact_work_order
    columns:
      - name: work_order_key
        tests: [not_null, unique]
      - name: status
        tests:
          - not_null
